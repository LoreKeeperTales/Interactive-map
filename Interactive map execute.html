<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ellond Interactive Atlas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #1b1814;
            color: #e7ddc7;
            font-family: Georgia, "Times New Roman", serif;
        }


        /* =========================
           HEADER
        ========================= */

        header {
            height: 70px;

            display: flex;
            align-items: center;
            gap: 30px;

            padding: 0 30px;

            background: #211d18;
            border-bottom: 1px solid #665944;
        }

        header h1 {
            margin: 0;

            letter-spacing: 4px;
            font-size: 24px;
        }

        header .subtitle {
            color: #a99a80;
            font-size: 14px;

            margin-right: auto;
        }


        /* =========================
           HEADER CONTROLS
        ========================= */

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .zoom-controls {
            display: flex;
            gap: 6px;
        }

        .zoom-controls button,
        .panel-toggle {
            padding: 8px 12px;

            background: #322b22;
            color: #e7ddc7;

            border: 1px solid #88775a;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 14px;

            cursor: pointer;
        }

        .zoom-controls button:hover,
        .panel-toggle:hover {
            background: #44392d;
        }


        /* =========================
           MAIN LAYOUT
        ========================= */

        .layout {
            display: grid;

            grid-template-columns: 1fr 340px;

            height: calc(100vh - 70px);
        }

        .layout.panel-hidden {
            grid-template-columns: 1fr;
        }

        .layout.panel-hidden aside {
            display: none;
        }


        /* =========================
           MAP AREA
        ========================= */

        .map-container {
            position: relative;

            overflow: auto;

            background: #111;
        }

        .map-stage {
            position: relative;

            width: 1400px;
            min-height: 900px;
        }

        .map-wrapper {
            position: relative;

            width: 1400px;

            transform-origin: top left;
        }

        .world-map {
            display: block;

            width: 100%;
            height: auto;
        }


        /* =========================
           MAP MARKERS
        ========================= */

        .marker {
            position: absolute;

            width: 18px;
            height: 18px;

            border: 3px solid #e9d9b5;
            background: #6d3528;

            border-radius: 50%;

            cursor: pointer;

            transform: translate(-50%, -50%);

            transition:
                transform 0.15s,
                background 0.15s;
        }

        .marker:hover {
            transform:
                translate(-50%, -50%)
                scale(1.35);

            background: #a75438;
        }

        .marker-label {
            position: absolute;

            left: 20px;
            top: -6px;

            white-space: nowrap;

            padding: 4px 7px;

            background:
                rgba(20, 17, 13, 0.85);

            border:
                1px solid #675b48;

            color: #eee3cb;

            font-size: 13px;

            pointer-events: none;
        }


        /* =========================
           SIDEBAR
        ========================= */

        aside {
            overflow-y: auto;

            padding: 25px;

            background: #252019;

            border-left:
                1px solid #665944;
        }

        aside h2 {
            margin-top: 0;

            border-bottom:
                1px solid #665944;

            padding-bottom: 10px;

            letter-spacing: 1px;
        }

        .location-type {
            color: #aa9b82;
            font-style: italic;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 5px;

            color: #c8b78f;

            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 2px;
        }

        .placeholder {
            color: #938872;
            font-style: italic;
        }


        /* =========================
           BUTTONS
        ========================= */

        .button {
            display: inline-block;

            margin-top: 15px;
            padding: 9px 14px;

            border: 1px solid #88775a;

            background: #322b22;
            color: #e7ddc7;

            text-decoration: none;

            font-family: Georgia, "Times New Roman", serif;

            cursor: pointer;
        }

        .button:hover {
            background: #44392d;
        }


        /* =========================
           EXPANDED LOCATION PANEL
        ========================= */

        .info-section {
            display: grid;

            grid-template-columns: 42px 1fr;

            gap: 12px;

            margin-top: 24px;
        }

        .info-icon {
            font-size: 24px;
            color: #c8b78f;

            text-align: center;

            padding-top: 2px;
        }

        .info-content {
            min-width: 0;
        }

        .info-heading {
            margin-bottom: 7px;

            color: #c8b78f;

            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 2px;
        }

        .info-content p {
            margin-top: 0;
            margin-bottom: 8px;

            line-height: 1.35;
        }

        .info-small {
            color: #a99a80;

            font-style: italic;

            line-height: 1.4;
        }

        .map-button {
            display: block;

            width: 100%;

            margin-top: 20px;
            margin-bottom: 8px;

            padding: 13px 15px;

            background: #322b22;
            color: #e7ddc7;

            border: 1px solid #88775a;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;

            text-align: center;
            text-decoration: none;

            cursor: pointer;
        }

        .map-button:hover {
            background: #44392d;
        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>
        ELLOND
    </h1>

    <span class="subtitle">
        Interactive World Atlas
    </span>


    <div class="header-controls">


        <div class="zoom-controls">

            <button onclick="zoomOut()">
                −
            </button>

            <button
                id="zoom-display"
                onclick="resetZoom()"
            >
                100%
            </button>

            <button onclick="zoomIn()">
                +
            </button>

        </div>


        <button
            class="panel-toggle"
            onclick="togglePanel()"
            id="panel-toggle"
        >
            Hide Panel
        </button>


    </div>

</header>



<!-- =========================
     MAIN LAYOUT
========================= -->

<div
    class="layout"
    id="main-layout"
>


    <!-- =========================
         WORLD MAP
    ========================= -->

    <main
        class="map-container"
        id="map-container"
    >

        <div
            class="map-stage"
            id="map-stage"
        >

            <div
                class="map-wrapper"
                id="map-wrapper"
            >


                <!-- WORLD MAP IMAGE -->

                <img
                    src="maps/Ellond borders.png"
                    class="world-map"
                    alt="Map of Ellond"
                >



                <!-- =========================
                     XAL'TORATH
                ========================= -->

                <div
                    class="marker"
                    style="left: 24%; top: 38%;"
                    onclick="showLocation('xaltorath')"
                >

                    <span class="marker-label">
                        Xal'Torath
                    </span>

                </div>



                <!-- =========================
                     PORT ASTER
                ========================= -->

                <div
                    class="marker"
                    style="left: 30%; top: 40%;"
                    onclick="showLocation('portaster')"
                >

                    <span class="marker-label">
                        Port Aster
                    </span>

                </div>



                <!-- =========================
                     MOSSHOLLOW
                ========================= -->

                <div
                    class="marker"
                    style="left: 31%; top: 36%;"
                    onclick="showLocation('mosshollow')"
                >

                    <span class="marker-label">
                        Mosshollow
                    </span>

                </div>



                <!-- =========================
                     IRONHALL
                ========================= -->

                <div
                    class="marker"
                    style="left: 53%; top: 25%;"
                    onclick="showLocation('ironhall')"
                >

                    <span class="marker-label">
                        Ironhall
                    </span>

                </div>



                <!-- =========================
                     GREENHAVEN
                ========================= -->

                <div
                    class="marker"
                    style="left: 55%; top: 80%;"
                    onclick="showLocation('greenhaven')"
                >

                    <span class="marker-label">
                        Greenhaven
                    </span>

                </div>


            </div>

        </div>

    </main>



    <!-- =========================
         INFORMATION PANEL
    ========================= -->

    <aside id="info-panel">


        <h2>
            Ellond
        </h2>


        <p class="location-type">
            World Map
        </p>


        <p>
            Select a location on the map to view information.
        </p>


        <div class="section-title">
            Atlas
        </div>


        <p>
            Settlements, regions, ruins, guilds, temples and other
            important locations can be accessed directly from the map.
        </p>


    </aside>


</div>



<script>


    /* =========================
       ZOOM
    ========================= */

    let currentZoom = 1;

    const minimumZoom = 0.5;
    const maximumZoom = 2.5;
    const zoomStep = 0.1;


    function updateZoom() {

        const wrapper =
            document.getElementById("map-wrapper");

        const stage =
            document.getElementById("map-stage");

        const display =
            document.getElementById("zoom-display");


        wrapper.style.transform =
            `scale(${currentZoom})`;


        stage.style.width =
            `${1400 * currentZoom}px`;

        stage.style.height =
            `${900 * currentZoom}px`;


        display.textContent =
            `${Math.round(currentZoom * 100)}%`;

    }


    function zoomIn() {

        currentZoom += zoomStep;

        if (currentZoom > maximumZoom) {
            currentZoom = maximumZoom;
        }

        updateZoom();

    }


    function zoomOut() {

        currentZoom -= zoomStep;

        if (currentZoom < minimumZoom) {
            currentZoom = minimumZoom;
        }

        updateZoom();

    }


    function resetZoom() {

        currentZoom = 1;

        updateZoom();

    }



    /* =========================
       PANEL TOGGLE
    ========================= */

    function togglePanel() {

        const layout =
            document.getElementById("main-layout");

        const button =
            document.getElementById("panel-toggle");


        layout.classList.toggle(
            "panel-hidden"
        );


        if (
            layout.classList.contains(
                "panel-hidden"
            )
        ) {

            button.textContent =
                "Show Panel";

        } else {

            button.textContent =
                "Hide Panel";

        }

    }



    /* =========================
       LOCATION DATABASE
    ========================= */

    const locations = {



        /* =========================
           XAL'TORATH
        ========================= */

        xaltorath: {

            name:
                "Xal'Torath",

            type:
                "Lizardfolk City — West Marches",

            description:
                "The largest city in the West Marches and the political heart of the Lizardfolk clans. Built on massive stone terraces above the marshes, connected by bridges, canals, and towering mangrove roots. Much of the city predates the Empire by thousands of years.",

            population:
                "Approximately 14,000",

            knownFor:
                "Marsh Council chambers, Temple of Asgorath, Great Beast Market, exotic spices, dinosaur mounts, ancient stone observatories and the Dragon Relic Museum.",

            history:
                "Much of the stonework predates the modern kingdoms of Ellond by thousands of years.",

            dm:
                "Add hidden information, adventure hooks and campaign secrets here."

        },



        /* =========================
           PORT ASTER
        ========================= */

        portaster: {

            name:
                "Port Aster",

            map:
                "locations/port-aster.html",

            type:
                "Port Town — West Marches",

            description:
                "A busy coastal settlement and stopping point for travelers, merchants and adventurers. Known for its diverse cultures, thriving markets and access to the West Marches.",

            population:
                "Unknown",

            government:
                "The Marsh Council",

            governmentDetails:
                "4 Lizardfolk Clan Elders, 1 Tortle Elder, 1 Yuan-ti Representative, 1 Merchant Consortium Representative, 1 Adventure Guild Representative, and 1 Imperial Envoy.",

            governmentNote:
                "The Imperial Envoy is non-voting except on matters directly concerning imperial affairs.",

            knownFor:
                "Trade, ships, travelers, its adventurer notice board, and its role as a gateway to the West Marches.",

            atmosphere:
                "Visitors immediately recognize that they have left the Empire behind. Raised stone buildings protect against seasonal floods, while lush jungle vegetation fills the streets. Markets overflow with exotic fruits, spices, fish, reptiles and jungle goods. Lizardfolk guards patrol the streets, Tortles manage much of the fishing and river trade, and Yuan-ti merchants negotiate beneath colorful awnings. Imperial banners are present, but are outnumbered by the banners of the ancient Lizardfolk clans.",

            history:
                "Port Aster began as a small Lizardfolk settlement established by clans migrating from the central swamps toward the western coast. As trade between the peoples of Ellond grew, the clans recognized the value of direct access to foreign merchants and sea routes. What began as a trading outpost gradually became the principal gateway between the West Marches and the wider world. Tortles, Yuan-ti, merchants, sailors, and adventurers followed, transforming Port Aster into a diverse port while its Lizardfolk founders retained much of its culture and political influence. Today, Port Aster stands as a meeting place between the ancient traditions of the West Marches and the growing trade of Ellond.",

            dm:
                "Add hidden campaign information here."

        },



        /* =========================
           MOSSHOLLOW
        ========================= */

        mosshollow: {

            name:
                "Mosshollow",

            map:
                "locations/mosshollow.html",

            type:
                "Fishing Village",

            description:
                "A quiet fishing village built on stilts above the marsh waters. Wooden walkways connect homes, docks and small communal buildings across the wetlands.",

            population:
                "Approximately 900",

            exports:
                "Salted fish, pearl diving, marsh reeds and freshwater oysters.",

            knownFor:
                "Giant lily fields, a friendly Tortle population and excellent seafood.",

            history:
                "Mosshollow began as a small fishing settlement along the shores of a broad inland lake, surrounded by the wetlands of the West Marches. Its calm waters, rich fishing grounds, and abundant reeds provided everything the early settlement needed. Over generations, Lizardfolk and Tortles built their homes on stilts along the lake and established traditions of fishing, pearl diving, and gathering marsh plants. While Port Aster grew into a busy center of trade, Mosshollow remained deliberately small, a quiet village where life still follows the rhythms of the lake and marsh.",

            dm:
                "Add hidden campaign information here."

        },



        /* =========================
           IRONHALL
        ========================= */

        ironhall: {

            name:
                "Ironhall",

            type:
                "Dwarven Capital — Central Highlands",

            description:
                "A fortified dwarven city built into the mountains of the Central Highlands.",

            population:
                "Predominantly Dwarven",

            knownFor:
                "Dwaranite, mining, smithing and the great dwarven trading market outside its walls.",

            history:
                "Ironhall became the principal political and commercial center of the Central Highlands.",

            dm:
                "Add hidden campaign information here."

        },



        /* =========================
           GREENHAVEN
        ========================= */

        greenhaven: {

            name:
                "Greenhaven",

            type:
                "Human Capital — Southern Empire",

            description:
                "Greenhaven is a prosperous farming and harbour town situated along the northern edge of the Southern Empire. The countryside surrounding Greenhaven contains some of the most fertile land in the Empire. Vast fields stretch beyond the town for miles, broken by orchards, grazing lands, farmsteads, mills and small agricultural villages. Wheat, barley, oats, vegetables and fruit are produced here in enormous quantities. Greenhaven and its surrounding farms provide most of the food consumed throughout the Southern Empire, earning the region the common nickname The Granary of the South.",

            population:
                "Predominantly Human",

            knownFor:
                "Grand market, extensive farmland, grain production and the Granary of the South.",

            history:
                "Greenhaven began as a frontier settlement near the southern edge of the Empire, founded to support trade, farming, and travel between the settled lands and the wilder regions beyond. Over time, merchants, hunters, farmers, and travelers turned the settlement into a steady stopping point rather than a major city. Its position made it valuable without ever making it crowded, and much of Greenhaven's character still comes from that balance between civilization and the open road. Today, it is known as a practical, welcoming town where caravans resupply, travelers rest, and news from the southern reaches of Ellond often arrives first.",

            dm:
                "Add hidden campaign information here."

        }

    };



    /* =========================
       SHOW LOCATION
    ========================= */

    function showLocation(id) {

        const location =
            locations[id];


        if (!location) {
            return;
        }


        const panel =
            document.getElementById("info-panel");


        panel.innerHTML = `

            <h2>
                ${location.name}
            </h2>


            <p class="location-type">
                ${location.type}
            </p>


            <p>
                ${location.description}
            </p>


            ${location.map ? `

                <a
                    class="map-button"
                    href="${location.map}"
                >
                    View ${location.name} Map
                </a>

            ` : ""}



            <div class="info-section">

                <div class="info-icon">
                    ◉
                </div>

                <div class="info-content">

                    <div class="info-heading">
                        Population
                    </div>

                    <p>
                        ${location.population}
                    </p>

                </div>

            </div>



            ${location.government ? `

                <div class="info-section">

                    <div class="info-icon">
                        ◆
                    </div>

                    <div class="info-content">

                        <div class="info-heading">
                            Government
                        </div>

                        <p>
                            ${location.government}
                        </p>

                        <p class="info-small">
                            ${location.governmentDetails}
                        </p>

                        ${location.governmentNote ? `

                            <p class="info-small">
                                ${location.governmentNote}
                            </p>

                        ` : ""}

                    </div>

                </div>

            ` : ""}



            ${location.exports ? `

                <div class="info-section">

                    <div class="info-icon">
                        ↗
                    </div>

                    <div class="info-content">

                        <div class="info-heading">
                            Exports
                        </div>

                        <p>
                            ${location.exports}
                        </p>

                    </div>

                </div>

            ` : ""}



            <div class="info-section">

                <div class="info-icon">
                    ★
                </div>

                <div class="info-content">

                    <div class="info-heading">
                        Known For
                    </div>

                    <p>
                        ${location.knownFor}
                    </p>

                </div>

            </div>



            ${location.atmosphere ? `

                <div class="info-section">

                    <div class="info-icon">
                        ❧
                    </div>

                    <div class="info-content">

                        <div class="info-heading">
                            Atmosphere
                        </div>

                        <p>
                            ${location.atmosphere}
                        </p>

                    </div>

                </div>

            ` : ""}



            <div class="info-section">

                <div class="info-icon">
                    ▤
                </div>

                <div class="info-content">

                    <div class="info-heading">
                        History
                    </div>

                    <p>
                        ${location.history}
                    </p>

                </div>

            </div>



            <div class="info-section">

                <div class="info-icon">
                    ≡
                </div>

                <div class="info-content">

                    <div class="info-heading">
                        DM Notes
                    </div>

                    <p class="placeholder">
                        ${location.dm}
                    </p>

                </div>

            </div>



            ${location.map ? `

                <button
                    class="button"
                    onclick="openLocation('${id}')"
                >
                    Open Location
                </button>

            ` : ""}

        `;

    }



    /* =========================
       OPEN LOCATION PAGE
    ========================= */

    function openLocation(id) {


        if (id === "portaster") {

            window.location.href =
                "locations/port-aster.html";

        }


        if (id === "mosshollow") {

            window.location.href =
                "locations/mosshollow.html";

        }

    }



    /* =========================
       INITIALIZE
    ========================= */

    updateZoom();


</script>


</body>

</html>
