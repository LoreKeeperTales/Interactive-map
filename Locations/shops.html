document.addEventListener('click',e=>{const btn=e.target.closest('.shop-open');if(btn)openShop(decodeURIComponent(btn.dataset.shop));});
function openShop(name){const shop=inventory[name];if(!shop)return;const esc=escapeHTML;
let content='<button class="button" type="button" id="closeShop">← Back to Shops</button><h2>'+esc(name)+'</h2><p class="subtitle">'+esc(shop.owner)+' · '+esc(shop.guild)+'</p><p>Prices shown are the Normal favorability prices unless stated otherwise. Guild exclusives require the appropriate guild standing.</p>';
for(const [section,items] of Object.entries(shop.sections)){content+='<h3>'+esc(section)+'</h3><table><thead><tr><th>Wares</th><th>Price / access</th></tr></thead><tbody>'+items.map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td></tr>').join('')+'</tbody></table>';}
content+='<h3>Other Services</h3><p>'+shop.services.map(esc).join(' · ')+'</p>';
document.getElementById('shopDetail').innerHTML=content;document.getElementById('shopDetail').hidden=false;document.getElementById('shopList').hidden=true;window.scrollTo(0,0);
document.getElementById('closeShop').onclick=()=>{document.getElementById('shopDetail').hidden=true;document.getElementById('shopList').hidden=false;};}
